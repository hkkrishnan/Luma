<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#fbfcfc"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:"/>
  <title>NorthStar Lite</title>
  <script src="./northstar-markdown.js?v=2" defer></script>
  <script src="./app.js?v=19" defer></script>
  <link rel="stylesheet" href="./lite-enhancements.css?v=28">
  <style>
    .lite-menu-item .lite-icon { flex: 0 0 19px; align-self: center; }
    .lite-menu-item[data-action="settings"] .lite-icon { width: 20px; height: 20px; }
    .lite-menu-danger { color: #a14f52; }
    .lite-canvas { padding: 12px 20px 18px; }
    .lite-topbar { gap: 16px; }
    .lite-identity { gap: 14px; }
    .lite-date { font-size: 17px; }
    .lite-switcher { gap: 14px; }
    .lite-switch { min-height: 24px; padding: 2px 0; font-size: 12px; }
    .lite-capture-wrap { width: min(360px, 30vw); min-width: 240px; height: 42px; padding: 0 8px 0 11px; }
    .lite-capture { height: 40px; font-size: 13px; }
    .lite-capture-icon { width: 24px; margin-right: 5px; }
    .lite-mode-button { width: 28px; height: 28px; }
    .lite-save, .lite-menu-button { width: 38px; height: 38px; }
    .lite-actions::before { height: 34px; margin: 0 12px 0 16px; }
    .lite-save { margin-right: 7px; }
    .lite-stage { min-height: calc(100vh - 78px); margin-top: 4px; }
    .lite-notes-input { height: calc(100% - 44px); margin-top: 12px; }
    .lite-capture:focus-visible, .lite-notes-input:focus-visible { outline: 0; }
    .lite-axis-x .axis-label:first-child { margin-left: 32px; }
    .lite-axis-x .axis-label:last-child { margin-right: 32px; }
    .lite-axis-x::after { right: 35px; }
    .lite-notes-input { background: transparent; }
    .lite-notes.is-editing { height: min(360px, 42vh); min-height: 300px; bottom: 6%; padding: 18px 20px; }
    .lite-editor-kicker { margin-bottom: 6px; font-size: 12px; }
    .lite-editor-title { padding-bottom: 7px; font-size: 16px; }
    .lite-editor-label { gap: 3px; margin-top: 8px; }
    .lite-editor-field { height: 30px; padding: 4px 7px; }
    .lite-editor-notes { height: 56px; padding: 6px 7px; }
    .lite-editor-actions { margin-top: 10px; }
    .lite-editor-save, .lite-editor-delete { padding: 7px 10px; font-size: 12px; }
    @media (max-width: 780px) {
      .lite-canvas { padding: 10px 12px 18px; }
      .lite-capture-wrap { min-width: 0; }
      .lite-axis-x::after { right: 14px; }
    }
  </style>
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body><input id="markdown-file" class="lite-file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain"><div id="root"></div></body>
</html>
